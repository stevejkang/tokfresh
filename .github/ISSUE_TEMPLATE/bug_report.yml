name: Bug report
description: Report something that isn't working in TokFresh
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        **Never paste OAuth tokens, API tokens, or Cloudflare credentials** — redact them before submitting.
  - type: dropdown
    id: step
    attributes:
      label: Where did it happen?
      options:
        - Connect Claude (OAuth)
        - Set schedule
        - Deploy to Cloudflare
        - Scheduled worker (after deployment)
        - Landing / other page
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: error
    attributes:
      label: Error message or logs
      description: Browser console output, on-screen error, or Cloudflare Worker logs. Redact any tokens.
      render: shell
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 130 on macOS 15
    validations:
      required: true
